name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Types, tests and builds
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test
      - run: pnpm test:types
      - name: Registry is up to date
        run: |
          pnpm registry:build
          if [ -n "$(git status --porcelain -- site/public/r)" ]; then
            git status --short -- site/public/r
            echo "::error::site/public/r is out of date. Run pnpm registry:build and commit the result."
            exit 1
          fi
      - run: pnpm build
      - run: pnpm site:build
      # Chrome for the page specs; Playwright's own Chromium, Firefox and WebKit for the part tests and specs
      - run: pnpm exec playwright install --with-deps chrome chromium firefox webkit
      - run: pnpm test:parts
      - run: pnpm test:browser
      - run: pnpm test:css-order
      - name: Upload test report and traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright
          path: .artifacts/playwright*
          retention-days: 7

  consumer:
    name: Consumer installs
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chrome webkit
      - run: pnpm test:consumer
      - name: Upload consumer logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: consumer
          path: .artifacts/consumer
          retention-days: 7
